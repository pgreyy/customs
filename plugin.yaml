name: customs
title: "customs: bait-file tripwire"
version: 0.6.1
description: "Plants fake credential files and blocks a hijacked agent the moment it reaches for one, before any value is read or sent. No network calls by default."
requires_hermes: ">=0.23.0"
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - post_approval_response
provides_middleware:
  - llm_request
provides_commands:
  - customs
config_schema:
  lockdown:
    type: bool
    default: true
    description: "After a blocked leak attempt, send every network action in that session to approval until /customs unlock."
  alert_target:
    type: str
    default: ""
    description: "Optional, off by default. A Hermes messaging target such as telegram or telegram:<chat id>; alerts are also pushed there through hermes send. Empty means no push and no network calls."
